<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Копировальщик текста</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.3s, color 0.3s;
        }

            /* Светлая тема (по умолчанию) */
            body.light-theme {
                background: #ffffff;
                color: #1a202c;
            }

                body.light-theme .container {
                    background: #ffffff;
                }

                body.light-theme .copy-btn {
                    background: #f0f4fa;
                    color: #1a202c;
                }

                    body.light-theme .copy-btn:hover {
                        background: #e2e8f0;
                    }

                    body.light-theme .copy-btn:active {
                        background: #d0d8e4;
                    }

                body.light-theme .control-panel {
                    background: #ffffff;
                    border-color: #e2e8f0;
                }

                    body.light-theme .control-panel .panel-title {
                        color: #7a8a9e;
                    }

                    body.light-theme .control-panel .mode-group {
                        border-bottom-color: #eef2f6;
                    }

                        body.light-theme .control-panel .mode-group label {
                            color: #2d3748;
                        }

                            body.light-theme .control-panel .mode-group label:hover {
                                background: #f0f4fa;
                            }

                    body.light-theme .control-panel .size-group .size-label {
                        color: #4a5568;
                    }

                    body.light-theme .control-panel .size-btn {
                        border-color: #d1d9e6;
                        background: #f7fafc;
                        color: #2d3748;
                    }

                        body.light-theme .control-panel .size-btn:hover {
                            background: #edf2f7;
                        }

                        body.light-theme .control-panel .size-btn:active {
                            background: #e2e8f0;
                        }

                    body.light-theme .control-panel .size-display {
                        color: #2d3748;
                    }

                body.light-theme .theme-toggle {
                    background: #f0f4fa;
                    color: #1a202c;
                    border-color: #d1d9e6;
                }

                    body.light-theme .theme-toggle:hover {
                        background: #e2e8f0;
                    }

            /* Тёмная тема */
            body.dark-theme {
                background: #1a1a2e;
                color: #e2e8f0;
            }

                body.dark-theme .container {
                    background: #1a1a2e;
                }

                body.dark-theme .copy-btn {
                    background: #2d2d44;
                    color: #e2e8f0;
                }

                    body.dark-theme .copy-btn:hover {
                        background: #3d3d5a;
                    }

                    body.dark-theme .copy-btn:active {
                        background: #4a4a6a;
                    }

                body.dark-theme .control-panel {
                    background: #16213e;
                    border-color: #2d2d44;
                }

                    body.dark-theme .control-panel .panel-title {
                        color: #8899bb;
                    }

                    body.dark-theme .control-panel .mode-group {
                        border-bottom-color: #2d2d44;
                    }

                        body.dark-theme .control-panel .mode-group label {
                            color: #c8d0dc;
                        }

                            body.dark-theme .control-panel .mode-group label:hover {
                                background: #2d2d44;
                            }

                    body.dark-theme .control-panel .size-group .size-label {
                        color: #8899bb;
                    }

                    body.dark-theme .control-panel .size-btn {
                        border-color: #3d3d5a;
                        background: #2d2d44;
                        color: #c8d0dc;
                    }

                        body.dark-theme .control-panel .size-btn:hover {
                            background: #3d3d5a;
                        }

                        body.dark-theme .control-panel .size-btn:active {
                            background: #4a4a6a;
                        }

                    body.dark-theme .control-panel .size-display {
                        color: #c8d0dc;
                    }

                body.dark-theme .theme-toggle {
                    background: #2d2d44;
                    color: #e2e8f0;
                    border-color: #3d3d5a;
                }

                    body.dark-theme .theme-toggle:hover {
                        background: #3d3d5a;
                    }

                body.dark-theme .toast {
                    background: #2d2d44;
                    color: #e2e8f0;
                }

        .container {
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 40px 20px;
            margin: 60px 0 40px 0;
            transition: background 0.3s;
        }

        .copy-btn {
            width: 100%;
            max-width: 500px;
            padding: 14px 24px;
            font-size: 17px;
            font-weight: 500;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            position: relative;
        }

            .copy-btn .label-short {
                display: none;
            }

            .copy-btn .label-medium {
                display: none;
            }

            .copy-btn .label-full {
                display: none;
            }

        .mode-short .copy-btn .label-short {
            display: inline;
        }

        .mode-medium .copy-btn .label-medium {
            display: inline;
        }

        .mode-full .copy-btn .label-full {
            display: inline;
        }

        .control-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 1000;
            min-width: 130px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            transition: background 0.3s, border-color 0.3s;
            border: 1px solid;
        }

            .control-panel .panel-title {
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                font-weight: 600;
                text-align: center;
                margin-bottom: 2px;
                transition: color 0.3s;
            }

            .control-panel .mode-group {
                display: flex;
                flex-direction: column;
                gap: 4px;
                padding-bottom: 8px;
                border-bottom: 1px solid;
                transition: border-color 0.3s;
            }

                .control-panel .mode-group label {
                    display: flex;
                    align-items: center;
                    gap: 8px;
                    font-size: 14px;
                    cursor: pointer;
                    padding: 3px 6px;
                    border-radius: 4px;
                    transition: background 0.15s, color 0.3s;
                }

                .control-panel .mode-group input[type="radio"] {
                    accent-color: #2b6cb0;
                    width: 15px;
                    height: 15px;
                    cursor: pointer;
                    flex-shrink: 0;
                }

        body.dark-theme .control-panel .mode-group input[type="radio"] {
            accent-color: #6b9fd4;
        }

        .control-panel .size-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding-top: 4px;
        }

            .control-panel .size-group .size-label {
                font-size: 12px;
                font-weight: 500;
                transition: color 0.3s;
            }

        .control-panel .size-btn {
            width: 32px;
            height: 32px;
            border: 1px solid;
            border-radius: 6px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .control-panel .size-display {
            font-size: 14px;
            font-weight: 600;
            min-width: 32px;
            text-align: center;
            transition: color 0.3s;
        }

        .theme-toggle-wrapper {
            display: flex;
            justify-content: center;
            padding-top: 8px;
            border-top: 1px solid transparent;
            transition: border-color 0.3s;
        }

        body.light-theme .theme-toggle-wrapper {
            border-top-color: #eef2f6;
        }

        body.dark-theme .theme-toggle-wrapper {
            border-top-color: #2d2d44;
        }

        .theme-toggle {
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
            width: 100%;
        }

        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            padding: 12px 28px;
            border-radius: 6px;
            font-size: 17px;
            font-weight: 500;
            opacity: 0;
            transition: all 0.35s ease;
            pointer-events: none;
            z-index: 2000;
            transition: opacity 0.35s ease, transform 0.35s ease, background 0.3s, color 0.3s;
        }

            .toast.show {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }

        @media (max-width: 600px) {
            .control-panel {
                top: 12px;
                right: 12px;
                padding: 10px 12px;
                min-width: 110px;
            }

                .control-panel .mode-group label {
                    font-size: 12px;
                }

                .control-panel .size-btn {
                    width: 28px;
                    height: 28px;
                    font-size: 16px;
                }

                .control-panel .size-display {
                    font-size: 12px;
                    min-width: 28px;
                }

            .container {
                padding: 24px 16px;
                margin-top: 80px;
            }

            .copy-btn {
                font-size: 15px;
                padding: 12px 18px;
                max-width: 100%;
            }

            .toast {
                font-size: 15px;
                padding: 10px 20px;
                bottom: 24px;
                white-space: nowrap;
            }

            .theme-toggle {
                font-size: 12px;
                padding: 5px 10px;
            }
        }

        @media (max-width: 420px) {
            .control-panel {
                top: 8px;
                right: 8px;
                padding: 8px 10px;
                min-width: 90px;
            }

                .control-panel .mode-group label {
                    font-size: 11px;
                    gap: 5px;
                }

                .control-panel .mode-group input[type="radio"] {
                    width: 14px;
                    height: 14px;
                }

                .control-panel .size-btn {
                    width: 24px;
                    height: 24px;
                    font-size: 14px;
                }

                .control-panel .size-display {
                    font-size: 11px;
                    min-width: 24px;
                }

            .copy-btn {
                font-size: 13px;
                padding: 10px 14px;
            }

            .theme-toggle {
                font-size: 11px;
                padding: 4px 8px;
            }
        }
    </style>
</head>

            <span class="label-short">40. Оскробление тюленя</span>
            <span class="label-medium">40. Вы оскорбили тюленя. Что является прямым оскорблением стримера.</span>
            <span class="label-full">40. Вы оскорбили тюленя. Что является прямым оскорблением стримера. При повторном нарушении мут или бан в зависимости от тяжести нарушения.</span>

    <div class="toast" id="toast">Успешно скопировано!</div>

    <script>
        (function () {
            'use strict';

            const container = document.getElementById('appContainer');
            const radioButtons = document.querySelectorAll('input[name="mode"]');

            function applyMode(mode) {
                container.classList.remove('mode-short', 'mode-medium', 'mode-full');
                container.classList.add('mode-' + mode);
                try {
                    localStorage.setItem('copyMode', mode);
                } catch (e) { /* ignore */ }
            }

            radioButtons.forEach(function (radio) {
                radio.addEventListener('change', function () {
                    if (this.checked) {
                        applyMode(this.value);
                    }
                });
            });

            try {
                const savedMode = localStorage.getItem('copyMode');
                if (savedMode && ['short', 'medium', 'full'].includes(savedMode)) {
                    const targetRadio = document.querySelector('input[name="mode"][value="' + savedMode + '"]');
                    if (targetRadio) {
                        targetRadio.checked = true;
                        applyMode(savedMode);
                    } else {
                        const defaultRadio = document.querySelector('input[name="mode"][value="short"]');
                        if (defaultRadio) {
                            defaultRadio.checked = true;
                            applyMode('short');
                        }
                    }
                } else {
                    const defaultRadio = document.querySelector('input[name="mode"][value="short"]');
                    if (defaultRadio) {
                        defaultRadio.checked = true;
                        applyMode('short');
                    }
                }
            } catch (e) {
                const defaultRadio = document.querySelector('input[name="mode"][value="short"]');
                if (defaultRadio) {
                    defaultRadio.checked = true;
                    applyMode('short');
                }
            }

            const sizeDisplay = document.getElementById('sizeDisplay');
            const sizeDec = document.getElementById('sizeDec');
            const sizeInc = document.getElementById('sizeInc');
            const allButtons = document.querySelectorAll('.copy-btn');

            let currentSize = 17;
            const MIN_SIZE = 10;
            const MAX_SIZE = 32;

            try {
                const savedSize = localStorage.getItem('copyFontSize');
                if (savedSize) {
                    const parsed = parseInt(savedSize, 10);
                    if (!isNaN(parsed) && parsed >= MIN_SIZE && parsed <= MAX_SIZE) {
                        currentSize = parsed;
                    }
                }
            } catch (e) { /* ignore */ }

            function applyFontSize(size) {
                allButtons.forEach(function (btn) {
                    btn.style.fontSize = size + 'px';
                });
                sizeDisplay.textContent = size;
                try {
                    localStorage.setItem('copyFontSize', String(size));
                } catch (e) { /* ignore */ }
            }

            sizeDec.addEventListener('click', function () {
                if (currentSize > MIN_SIZE) {
                    currentSize--;
                    applyFontSize(currentSize);
                }
            });

            sizeInc.addEventListener('click', function () {
                if (currentSize < MAX_SIZE) {
                    currentSize++;
                    applyFontSize(currentSize);
                }
            });

            applyFontSize(currentSize);

            // ---- Копирование ----
            const buttons = document.querySelectorAll('.copy-btn');
            const toast = document.getElementById('toast');
            let toastTimer = null;

            function showToast() {
                if (toastTimer) {
                    clearTimeout(toastTimer);
                    toastTimer = null;
                }
                toast.classList.remove('show');
                void toast.offsetWidth;
                toast.classList.add('show');
                toastTimer = setTimeout(function () {
                    toast.classList.remove('show');
                    toastTimer = null;
                }, 2000);
            }

            function fallbackCopy(text) {
                try {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    textarea.style.position = 'fixed';
                    textarea.style.opacity = '0';
                    textarea.style.left = '-9999px';
                    textarea.style.top = '-9999px';
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    showToast();
                } catch (err) {
                    console.error('Fallback copy failed:', err);
                }
            }

            buttons.forEach(function (btn) {
                btn.addEventListener('click', function () {
                    const textToCopy = this.getAttribute('data-copy');
                    if (!textToCopy) {
                        return;
                    }

                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(textToCopy)
                            .then(function () {
                                showToast();
                            })
                            .catch(function (err) {
                                console.error('Ошибка копирования:', err);
                                fallbackCopy(textToCopy);
                            });
                    } else {
                        fallbackCopy(textToCopy);
                    }
                });
            });

            // ---- Переключение темы ----
            const themeToggle = document.getElementById('themeToggle');
            const body = document.body;

            function applyTheme(theme) {
                body.classList.remove('light-theme', 'dark-theme');
                body.classList.add(theme);

                if (theme === 'dark-theme') {
                    themeToggle.textContent = '☀️ Светлая тема';
                } else {
                    themeToggle.textContent = '🌙 Тёмная тема';
                }

                try {
                    localStorage.setItem('theme', theme);
                } catch (e) { /* ignore */ }
            }

            try {
                const savedTheme = localStorage.getItem('theme');
                if (savedTheme && (savedTheme === 'light-theme' || savedTheme === 'dark-theme')) {
                    applyTheme(savedTheme);
                } else {
                    // По умолчанию светлая тема, если в системе тёмная - можно раскомментировать строку ниже
                    // if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    //     applyTheme('dark-theme');
                    // } else {
                    applyTheme('light-theme');
                    // }
                }
            } catch (e) {
                applyTheme('light-theme');
            }

            themeToggle.addEventListener('click', function () {
                if (body.classList.contains('light-theme')) {
                    applyTheme('dark-theme');
                } else {
                    applyTheme('light-theme');
                }
            });

        })();
    </script>
